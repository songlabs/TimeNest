name: TimeNest
options:
  bundleIdPrefix: com.song.TimeNest
  deploymentTarget:
    iOS: 17.0
  xcodeVersion: 15.0
  generateEmptyDirectories: true

settings:
  base:
    DEVELOPMENT_TEAM: ""
    CODE_SIGN_STYLE: Automatic
    SWIFT_VERSION: 5.9
    MARKETING_VERSION: 1.0
    CURRENT_PROJECT_VERSION: 1

targets:
  TimeNest:
    type: application
    platform: iOS
    deploymentTarget: "17.0"
    product: app
    bundleId: com.song.TimeNest
    sources:
      - path: TimeNest
        excludes:
          - "**/*.md"
      - path: TimeNest/Resources/ja.lproj
        buildPhase: resources
      - path: TimeNest/Resources/zh-Hans.lproj
        buildPhase: resources
      - path: TimeNest/Resources/en.lproj
        buildPhase: resources
      - path: TimeNest/Resources/ko.lproj
        buildPhase: resources
    settings:
      base:
        INFOPLIST_FILE: TimeNest/Info.plist
        PRODUCT_BUNDLE_IDENTIFIER: com.song.TimeNest
        PRODUCT_BUNDLE_PACKAGE_TYPE: APPL
        MACH_O_TYPE: mh_execute
        SKIP_INSTALL: NO
        ASSETCATALOG_COMPILER_APPICON_NAME: AppIcon
        GENERATE_INFOPLIST_FILE: NO
    scheme:
      environmentVariables:
        - environmentVariable:
            key: ENABLE_PREVIEWS
            value: "YES"
      build:
        preActions:
          - execute:
              script: "echo \"Building TimeNest for iOS...\""

  TimeNestTests:
    type: bundle.unit-test
    platform: iOS
    deploymentTarget: "17.0"
    product: unit-test
    bundleId: com.song.TimeNestTests
    sources:
      - path: Tests/TimeNestTests
    settings:
      base:
        PRODUCT_BUNDLE_IDENTIFIER: com.song.TimeNestTests
        SKIP_INSTALL: YES
        GENERATE_INFOPLIST_FILE: YES
        CODE_SIGNING_ALLOWED: NO
        CODE_SIGNING_REQUIRED: NO
        CODE_SIGNING_IDENTITY: ""
    scheme:
      testTargets:
        - TimeNestTests
    dependencies:
      - target: TimeNest
