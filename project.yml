name: TimeNest
options:
  bundleIdPrefix: com.timenest
  deploymentTarget:
    iOS: 17.0
  xcodeVersion: 15.0

settings:
  base:
    DEVELOPMENT_TEAM: ""
    CODE_SIGN_STYLE: Automatic
    SWIFT_VERSION: 5.9

targets:
  TimeNest:
    type: application
    platform: iOS
    sources:
      - path: TimeNest
    settings:
      base:
        INFOPLIST_FILE: TimeNest/Info.plist
    scheme:
      environmentVariables:
        - environmentVariable:
            key: ENABLE_PREVIEWS
            value: "YES"
