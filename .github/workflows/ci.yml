name: iOS CI

on:
  push:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: ios-ci-${{ github.ref }}
  cancel-in-progress: true

jobs:
  build-and-test:
    runs-on: macos-15
    timeout-minutes: 45
    steps:
      - uses: actions/checkout@v4
        with:
          persist-credentials: false

      - name: Select and verify Xcode 26.3
        run: |
          sudo xcode-select -s /Applications/Xcode_26.3.app/Contents/Developer
          xcodebuild -version
          SDK_VERSION=$(xcrun --sdk iphoneos --show-sdk-version)
          echo "iOS SDK $SDK_VERSION"
          test "${SDK_VERSION%%.*}" -ge 26

      - name: Install pinned Tuist
        uses: jdx/mise-action@v2

      - name: Install pinned CocoaPods
        run: |
          set -euo pipefail

          GEM_HOME="$RUNNER_TEMP/cocoapods-gems"
          BIN_DIR="$RUNNER_TEMP/cocoapods-bin"
          export GEM_HOME
          export GEM_PATH="$GEM_HOME"

          gem install cocoapods -v 1.16.2 \
            --no-document \
            --install-dir "$GEM_HOME" \
            --bindir "$BIN_DIR"

          echo "GEM_HOME=$GEM_HOME" >> "$GITHUB_ENV"
          echo "GEM_PATH=$GEM_PATH" >> "$GITHUB_ENV"
          echo "$BIN_DIR" >> "$GITHUB_PATH"

          echo "Using CocoaPods:"
          "$BIN_DIR/pod" --version
          test "$("$BIN_DIR/pod" --version)" = "1.16.2"

      - name: Generate Xcode project
        run: |
          set -euo pipefail
          test "$(tuist version)" = "4.65.0"
          bash Scripts/verify_ppocr_resources.sh
          tuist install
          tuist generate --no-open
          ! grep -Fq 'CalendarGeminiCellRecognitionService.swift' TimeNest.xcodeproj/project.pbxproj
          ! grep -Fq 'FirebaseAILogic' TimeNest.xcodeproj/project.pbxproj
          grep -Fq 'GoogleMobileAds' TimeNest.xcodeproj/project.pbxproj
          grep -Fq 'PPOCRService.swift' TimeNest.xcodeproj/project.pbxproj
          grep -Fq 'PP-OCRv6_det_small.onnx' TimeNest.xcodeproj/project.pbxproj

      - name: Install official ONNX Runtime pod
        run: |
          set -euo pipefail
          pod install
          grep -Fq 'onnxruntime-objc (1.29.0)' Podfile.lock
          grep -Fq 'Pods.xcodeproj' TimeNest.xcworkspace/contents.xcworkspacedata

      - name: Resolve Swift packages
        run: xcodebuild -resolvePackageDependencies -workspace TimeNest.xcworkspace -scheme TimeNest

      - name: Select simulator
        run: |
          SIMULATOR_ID=$(xcrun simctl list devices available -j | ruby -rjson -e '
            runtimes = JSON.parse(STDIN.read).fetch("devices").filter_map do |runtime, devices|
              version = runtime[/iOS[- ](\d+(?:[-.]\d+)*)/, 1]
              next unless version
              [version.split(/[-.]/).map(&:to_i), devices]
            end
            runtime = runtimes.select { |version, _| version.first >= 26 }.max_by(&:first)
            abort "No available iOS 26 or newer simulator runtime" unless runtime
            phone = runtime.last.find { |device| device["name"].start_with?("iPhone") }
            abort "No available iPhone in the selected simulator runtime" unless phone
            print phone.fetch("udid")
          ')
          echo "SIMULATOR_ID=$SIMULATOR_ID" >> "$GITHUB_ENV"

      - name: Build and run unit tests
        run: |
          set -o pipefail
          xcodebuild test \
            -workspace TimeNest.xcworkspace \
            -scheme TimeNest \
            -configuration Debug \
            -destination "platform=iOS Simulator,id=$SIMULATOR_ID" \
            -only-testing:TimeNestTests \
            -resultBundlePath "$RUNNER_TEMP/TimeNestTests.xcresult" | tee "$RUNNER_TEMP/unit-tests.log"

      - name: Build Release for simulator
        run: |
          set -o pipefail
          xcodebuild build \
            -workspace TimeNest.xcworkspace \
            -scheme TimeNest \
            -configuration Release \
            -destination "platform=iOS Simulator,id=$SIMULATOR_ID" \
            CODE_SIGNING_ALLOWED=NO | tee "$RUNNER_TEMP/release-build.log"

      - name: Upload diagnostics
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: ios-ci-diagnostics
          path: |
            ${{ runner.temp }}/TimeNestTests.xcresult
            ${{ runner.temp }}/*.log
          retention-days: 7
          if-no-files-found: ignore
