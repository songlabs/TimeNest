name: TestFlight

on:
  workflow_dispatch:
    inputs:
      marketing_version:
        description: "Marketing version (e.g. 2.2 or 2.2.1)"
        required: true
        type: string

permissions:
  contents: read
  actions: read

concurrency:
  group: testflight-production
  cancel-in-progress: false

jobs:
  archive-and-upload:
    if: github.ref == 'refs/heads/main'
    runs-on: macos-15
    timeout-minutes: 120
    environment: testflight
    env:
      APP_BUNDLE_ID: com.song.TimeNest
      INTERNAL_GROUP_NAME: songlabs Internal Test
      APPLE_TEAM_ID: JCABFH9F66
    steps:
      - uses: actions/checkout@v4
        with:
          persist-credentials: false

      - name: Select and verify Xcode 26.3
        run: |
          sudo xcode-select -s /Applications/Xcode_26.3.app/Contents/Developer
          xcodebuild -version
          SDK_VERSION=$(xcrun --sdk iphoneos --show-sdk-version)
          echo "iOS SDK $SDK_VERSION"
          test "${SDK_VERSION%%.*}" -ge 26

      - name: Install pinned Tuist
        uses: jdx/mise-action@v2

      - name: Generate Xcode project
        run: |
          set -euo pipefail
          test "$(tuist version)" = "4.65.0"
          tuist install
          tuist generate --no-open
          grep -Fq 'CalendarGeminiCellRecognitionService.swift' TimeNest.xcodeproj/project.pbxproj
          grep -Fq 'FirebaseAI' TimeNest.xcodeproj/project.pbxproj
          grep -Fq 'FirebaseCore' TimeNest.xcodeproj/project.pbxproj
          grep -Fq 'GoogleMobileAds' TimeNest.xcodeproj/project.pbxproj

      - name: Validate required release configuration
        env:
          ASC_KEY_ID: ${{ secrets.ASC_KEY_ID }}
          ASC_ISSUER_ID: ${{ secrets.ASC_ISSUER_ID }}
          ASC_PRIVATE_KEY: ${{ secrets.ASC_PRIVATE_KEY }}
          APPLE_DISTRIBUTION_P12_BASE64: ${{ secrets.APPLE_DISTRIBUTION_P12_BASE64 }}
          APPLE_DISTRIBUTION_P12_PASSWORD: ${{ secrets.APPLE_DISTRIBUTION_P12_PASSWORD }}
          PROFILE_TIMENEST_BASE64: ${{ secrets.PROFILE_TIMENEST_BASE64 }}
          PROFILE_TIMENEST_WIDGET_BASE64: ${{ secrets.PROFILE_TIMENEST_WIDGET_BASE64 }}
        run: |
          test -n "$ASC_KEY_ID" || { echo "Missing ASC_KEY_ID"; exit 1; }
          test -n "$ASC_ISSUER_ID" || { echo "Missing ASC_ISSUER_ID"; exit 1; }
          test -n "$ASC_PRIVATE_KEY" || { echo "Missing ASC_PRIVATE_KEY"; exit 1; }
          test -n "$APPLE_DISTRIBUTION_P12_BASE64" || { echo "Missing APPLE_DISTRIBUTION_P12_BASE64"; exit 1; }
          test -n "$APPLE_DISTRIBUTION_P12_PASSWORD" || { echo "Missing APPLE_DISTRIBUTION_P12_PASSWORD"; exit 1; }
          test -n "$PROFILE_TIMENEST_BASE64" || { echo "Missing PROFILE_TIMENEST_BASE64"; exit 1; }
          test -n "$PROFILE_TIMENEST_WIDGET_BASE64" || { echo "Missing PROFILE_TIMENEST_WIDGET_BASE64"; exit 1; }
          test "$APPLE_TEAM_ID" = "JCABFH9F66" || { echo "APPLE_TEAM_ID must be JCABFH9F66"; exit 1; }

      - name: Install App Store Connect API key
        env:
          ASC_KEY_ID: ${{ secrets.ASC_KEY_ID }}
          ASC_PRIVATE_KEY: ${{ secrets.ASC_PRIVATE_KEY }}
        run: |
          KEY_DIRECTORY="$HOME/.appstoreconnect/private_keys"
          mkdir -p "$KEY_DIRECTORY"
          KEY_PATH="$KEY_DIRECTORY/AuthKey_${ASC_KEY_ID}.p8"
          printf '%s' "$ASC_PRIVATE_KEY" > "$KEY_PATH"
          chmod 600 "$KEY_PATH"
          echo "ASC_KEY_PATH=$KEY_PATH" >> "$GITHUB_ENV"

      - name: Install and validate fixed distribution signing materials
        env:
          APPLE_DISTRIBUTION_P12_BASE64: ${{ secrets.APPLE_DISTRIBUTION_P12_BASE64 }}
          APPLE_DISTRIBUTION_P12_PASSWORD: ${{ secrets.APPLE_DISTRIBUTION_P12_PASSWORD }}
          PROFILE_TIMENEST_BASE64: ${{ secrets.PROFILE_TIMENEST_BASE64 }}
          PROFILE_TIMENEST_WIDGET_BASE64: ${{ secrets.PROFILE_TIMENEST_WIDGET_BASE64 }}
        run: bash Scripts/install_distribution_signing.sh

      - name: Validate release version and set unique build number
        env:
          REQUESTED_MARKETING_VERSION: ${{ inputs.marketing_version }}
        run: |
          set -euo pipefail
          if [[ ! "$REQUESTED_MARKETING_VERSION" =~ ^[0-9]+(\.[0-9]+){1,2}$ ]]; then
            echo "Invalid marketing_version: $REQUESTED_MARKETING_VERSION" >&2
            exit 1
          fi

          MARKETING_VERSION="$REQUESTED_MARKETING_VERSION"
          BUILD_NUMBER="$(date -u +%s)"
          echo "MARKETING_VERSION=$MARKETING_VERSION" >> "$GITHUB_ENV"
          echo "BUILD_NUMBER=$BUILD_NUMBER" >> "$GITHUB_ENV"
          echo "Marketing version: $MARKETING_VERSION"
          echo "Build number: $BUILD_NUMBER"

      - name: Verify iOS CI passed for current commit
        env:
          GITHUB_TOKEN: ${{ github.token }}
        run: |
          set -euo pipefail
          RESPONSE_FILE="$RUNNER_TEMP/ios-ci-runs.json"
          curl --fail --silent --show-error \
            --header "Accept: application/vnd.github+json" \
            --header "Authorization: Bearer $GITHUB_TOKEN" \
            --header "X-GitHub-Api-Version: 2022-11-28" \
            --output "$RESPONSE_FILE" \
            "$GITHUB_API_URL/repos/$GITHUB_REPOSITORY/actions/workflows/ci.yml/runs?head_sha=$GITHUB_SHA&per_page=100"

          ruby -rjson -e '
            sha = ENV.fetch("GITHUB_SHA")
            runs = JSON.parse(File.read(ARGV.fetch(0))).fetch("workflow_runs")
            exact_runs = runs.select { |run| run.fetch("head_sha") == sha }

            if exact_runs.any? { |run| run.fetch("status") == "completed" && run["conclusion"] == "success" }
              puts "iOS CI passed for commit #{sha[0, 7]}. Continuing TestFlight release."
              exit
            end

            warn "No successful iOS CI run found for current commit #{sha[0, 7]}."
            if exact_runs.any? { |run| run.fetch("status") != "completed" }
              warn "iOS CI has not completed successfully for current commit."
              warn "Wait for iOS CI to finish, then run TestFlight again."
            end
            warn "TestFlight release aborted before Archive."
            exit 1
          ' "$RESPONSE_FILE"

      - name: Resolve Swift packages
        run: xcodebuild -resolvePackageDependencies -project TimeNest.xcodeproj -scheme TimeNest

      - name: Archive with fixed manual distribution signing
        run: |
          set -o pipefail
          security find-identity -v -p codesigning "$SIGNING_KEYCHAIN_PATH" | tee "$RUNNER_TEMP/signing-identities.log"
          grep -q 'Apple Distribution:' "$RUNNER_TEMP/signing-identities.log" || {
            echo "Apple Distribution identity is unavailable; automatic signing fallback is disabled." >&2
            exit 1
          }
          xcodebuild archive \
            -project TimeNest.xcodeproj \
            -scheme TimeNest \
            -configuration Release \
            -destination "generic/platform=iOS" \
            -archivePath "$RUNNER_TEMP/TimeNest.xcarchive" \
            MARKETING_VERSION="$MARKETING_VERSION" \
            CURRENT_PROJECT_VERSION="$BUILD_NUMBER" | tee "$RUNNER_TEMP/archive.log"

      - name: Verify archive versions
        run: |
          set -euo pipefail
          archive_path="$RUNNER_TEMP/TimeNest.xcarchive"
          shopt -s nullglob

          app_candidates=("$archive_path"/Products/Applications/*.app)
          if (( ${#app_candidates[@]} != 1 )); then
            echo "Expected exactly one main App in the archive, found ${#app_candidates[@]}." >&2
            exit 1
          fi
          app_path="${app_candidates[0]}"
          app_info="$app_path/Info.plist"
          test -f "$app_info" || { echo "Missing Main App Info.plist: $app_info" >&2; exit 1; }

          extension_candidates=("$app_path"/PlugIns/*.appex)
          widget_candidates=()
          for extension_path in "${extension_candidates[@]}"; do
            extension_info="$extension_path/Info.plist"
            test -f "$extension_info" || continue
            extension_point=$(/usr/libexec/PlistBuddy -c "Print :NSExtension:NSExtensionPointIdentifier" "$extension_info" 2>/dev/null || true)
            if [[ "$extension_point" == "com.apple.widgetkit-extension" ]]; then
              widget_candidates+=("$extension_path")
            fi
          done

          if (( ${#widget_candidates[@]} != 1 )); then
            echo "Expected exactly one Widget Extension in the Main App, found ${#widget_candidates[@]}." >&2
            exit 1
          fi
          widget_path="${widget_candidates[0]}"
          widget_info="$widget_path/Info.plist"

          read_plist_value() {
            /usr/libexec/PlistBuddy -c "Print :$2" "$1"
          }

          app_marketing_version=$(read_plist_value "$app_info" CFBundleShortVersionString)
          app_build_number=$(read_plist_value "$app_info" CFBundleVersion)
          widget_marketing_version=$(read_plist_value "$widget_info" CFBundleShortVersionString)
          widget_build_number=$(read_plist_value "$widget_info" CFBundleVersion)

          printf 'Release version verification\n\n'
          printf 'Main App (%s):\n' "$(basename "$app_path")"
          printf '  Marketing Version: %s\n' "$app_marketing_version"
          printf '  Build Number: %s\n\n' "$app_build_number"
          printf 'Widget (%s):\n' "$(basename "$widget_path")"
          printf '  Marketing Version: %s\n' "$widget_marketing_version"
          printf '  Build Number: %s\n\n' "$widget_build_number"
          printf 'Expected:\n'
          printf '  Marketing Version: %s\n' "$MARKETING_VERSION"
          printf '  Build Number: %s\n\n' "$BUILD_NUMBER"

          verification_failed=0
          if [[ "$app_marketing_version" != "$MARKETING_VERSION" ]]; then
            echo "Main App Marketing Version does not match the workflow input." >&2
            verification_failed=1
          fi
          if [[ "$app_build_number" != "$BUILD_NUMBER" ]]; then
            echo "Main App Build Number does not match the generated build number." >&2
            verification_failed=1
          fi
          if [[ "$widget_marketing_version" != "$MARKETING_VERSION" ]]; then
            echo "Widget Marketing Version does not match the workflow input." >&2
            verification_failed=1
          fi
          if [[ "$widget_build_number" != "$BUILD_NUMBER" ]]; then
            echo "Widget Build Number does not match the generated build number." >&2
            verification_failed=1
          fi
          if (( verification_failed != 0 )); then
            echo "Version verification failed." >&2
            exit 1
          fi

          echo "Version verification passed."

      - name: Verify archive signing and entitlements
        run: Scripts/verify_distribution_archive.sh "$RUNNER_TEMP/TimeNest.xcarchive"

      - name: Create export options
        run: |
          cat > "$RUNNER_TEMP/ExportOptions.plist" <<'PLIST'
          <?xml version="1.0" encoding="UTF-8"?>
          <!DOCTYPE plist PUBLIC "-//Apple//DTD PLIST 1.0//EN" "http://www.apple.com/DTDs/PropertyList-1.0.dtd">
          <plist version="1.0"><dict>
            <key>method</key><string>app-store-connect</string>
            <key>destination</key><string>export</string>
            <key>signingStyle</key><string>manual</string>
            <key>signingCertificate</key><string>Apple Distribution</string>
            <key>teamID</key><string>JCABFH9F66</string>
            <key>provisioningProfiles</key>
            <dict>
              <key>com.song.TimeNest</key><string>TimeNest App Store</string>
              <key>com.song.TimeNest.TimeNestWidgetExtension</key><string>TimeNest Widget App Store</string>
            </dict>
            <key>manageAppVersionAndBuildNumber</key><false/>
            <key>stripSwiftSymbols</key><true/>
            <key>uploadSymbols</key><true/>
          </dict></plist>
          PLIST

      - name: Export IPA with fixed manual distribution signing
        run: |
          set -o pipefail
          xcodebuild -exportArchive \
            -archivePath "$RUNNER_TEMP/TimeNest.xcarchive" \
            -exportPath "$RUNNER_TEMP/export" \
            -exportOptionsPlist "$RUNNER_TEMP/ExportOptions.plist" | tee "$RUNNER_TEMP/export.log"
          test -f "$RUNNER_TEMP/export/TimeNest.ipa"

      - name: Upload to App Store Connect
        env:
          ASC_KEY_ID: ${{ secrets.ASC_KEY_ID }}
          ASC_ISSUER_ID: ${{ secrets.ASC_ISSUER_ID }}
        run: |
          set -euo pipefail
          set +e
          xcrun altool --upload-app \
            --type ios \
            --file "$RUNNER_TEMP/export/TimeNest.ipa" \
            --apiKey "$ASC_KEY_ID" \
            --apiIssuer "$ASC_ISSUER_ID" 2>&1 | tee "$RUNNER_TEMP/upload.log"
          UPLOAD_PIPESTATUS=("${PIPESTATUS[@]}")
          set -e
          ALTOOL_EXIT="${UPLOAD_PIPESTATUS[0]}"
          TEE_EXIT="${UPLOAD_PIPESTATUS[1]}"

          if [[ "$ALTOOL_EXIT" -ne 0 ]]; then
            echo "App Store Connect upload command failed (exit code $ALTOOL_EXIT)." >&2
            exit 1
          fi
          if [[ "$TEE_EXIT" -ne 0 ]]; then
            echo "Failed to capture the App Store Connect upload log (tee exit code $TEE_EXIT)." >&2
            exit 1
          fi
          if [[ ! -f "$RUNNER_TEMP/upload.log" ]]; then
            echo "App Store Connect upload log was not created." >&2
            exit 1
          fi
          if grep -Eiq \
            'UPLOAD FAILED|Failed to upload package\.|Validation failed|STATE_ERROR\.VALIDATION_ERROR|Invalid Pre-Release Train' \
            "$RUNNER_TEMP/upload.log"; then
            echo "App Store Connect rejected the upload." >&2
            exit 1
          fi

          echo "App Store Connect upload completed without known failure markers."

      - name: Wait for processing and assign internal group
        if: success()
        env:
          ASC_KEY_ID: ${{ secrets.ASC_KEY_ID }}
          ASC_ISSUER_ID: ${{ secrets.ASC_ISSUER_ID }}
        run: |
          ruby Scripts/assign_testflight_group.rb \
            --key-path "$ASC_KEY_PATH" \
            --key-id "$ASC_KEY_ID" \
            --issuer-id "$ASC_ISSUER_ID" \
            --bundle-id "$APP_BUNDLE_ID" \
            --build-number "$BUILD_NUMBER" \
            --group-name "$INTERNAL_GROUP_NAME"

      - name: Remove temporary signing materials
        if: always()
        run: bash Scripts/cleanup_distribution_signing.sh

      - name: Remove API key
        if: always()
        run: |
          if [[ -n "${ASC_KEY_PATH:-}" ]]; then
            rm -f "$ASC_KEY_PATH"
          fi

      - name: Upload diagnostics
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: testflight-diagnostics-${{ github.run_id }}
          path: |
            ${{ runner.temp }}/*.log
            ${{ runner.temp }}/export/DistributionSummary.plist
          retention-days: 7
          if-no-files-found: ignore
